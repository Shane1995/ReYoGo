name: Version

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type (push to main defaults to patch)
        required: true
        type: choice
        options: [patch, minor, major]

jobs:
  tag:
    if: github.actor == 'Shane1995'
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Create version tag
        run: |
          git fetch --tags

          LATEST=$(git tag -l "v[0-9]*" --sort=-v:refname | grep -v beta | head -1)
          if [ -z "$LATEST" ]; then
            BASE="0.0.0"
          else
            BASE=$(echo "$LATEST" | sed 's/^v//')
          fi

          BUMP="${{ inputs.bump || 'patch' }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          TAG="v${MAJOR}.${MINOR}.${PATCH}"

          git tag "$TAG"
          git push origin "$TAG"
          echo "Created tag $TAG"
