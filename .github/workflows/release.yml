name: Release Desktop

on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'lib/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.base.json'

concurrency:
  group: release-desktop
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  version:
    if: github.actor == 'Shane1995'
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.semver.outputs.bump }}
      tag: ${{ steps.semver.outputs.tag }}
      version: ${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: semver
        name: Determine version bump
        run: |
          git fetch --tags
          bash scripts/semver-bump.sh desktop

  promote:
    needs: version
    if: needs.version.outputs.bump != 'skip'
    runs-on: ubuntu-latest
    environment: promote
    steps:
      - run: echo "Promoting desktop ${{ needs.version.outputs.tag }}"

  tag:
    needs: [version, promote]
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Create version tag
        run: |
          git fetch --tags
          TAG="${{ needs.version.outputs.tag }}"
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release ${TAG}"
          git push origin "$TAG"

  build-win:
    needs: [version, tag]
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @reyogo/desktop exec electron-builder install-app-deps
      - name: Build desktop
        env:
          PRODUCT_NAME: ReYoGo
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}/win
          VITE_APP_ENV: production
        run: |
          pnpm --filter @reyogo/desktop run clean
          pnpm --filter @reyogo/desktop run electron:build
          pnpm --filter @reyogo/desktop exec electron-builder --win --publish never --config electron-builder.config.js
      - uses: actions/upload-artifact@v7
        with:
          name: dist-win
          path: apps/desktop/release/
          retention-days: 7

  publish:
    name: Publish to production
    needs: [version, build-win]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-win
          path: artifacts/
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Upload to S3
        run: |
          VERSION="v${{ needs.version.outputs.version }}"
          aws s3 sync artifacts/ "s3://reyogo-desktop/production/win/${VERSION}/" \
            --exclude "win-unpacked/*" \
            --exclude "builder-debug.yml"
          YML=$(find artifacts/ -maxdepth 1 -name "*.yml" ! -name "builder-debug.yml" | head -1)
          sed "s|^path: |path: ${VERSION}/|; s|- url: |- url: ${VERSION}/|g" "$YML" > /tmp/manifest.yml
          aws s3 cp /tmp/manifest.yml "s3://reyogo-desktop/production/win/$(basename "$YML")"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ needs.version.outputs.tag }} \
            --repo ${{ github.repository }} \
            --generate-notes \
            --title "${{ needs.version.outputs.tag }}"
