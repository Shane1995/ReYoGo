name: Release Desktop

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "9.15.0"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - id: bump
        name: Bump version and create tag
        run: |
          git fetch --tags

          LATEST=$(git tag -l "v[0-9]*" --sort=-v:refname | grep -v beta | head -1)
          if [ -z "$LATEST" ]; then
            BASE="0.0.0"
          else
            BASE=$(echo "$LATEST" | sed 's/^v//')
          fi

          BUMP="${{ inputs.bump }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          VERSION="$MAJOR.$MINOR.$PATCH"
          TAG="v${VERSION}"

          git tag "$TAG"
          git push origin "$TAG"

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  build-win:
    needs: [version, ci]
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @reyogo/desktop exec electron-builder install-app-deps
      - name: Build desktop
        env:
          PRODUCT_NAME: ReYoGo
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}/win
          VITE_APP_ENV: production
        run: |
          pnpm --filter @reyogo/desktop run clean
          pnpm --filter @reyogo/desktop run electron:build
          pnpm --filter @reyogo/desktop exec electron-builder --win --publish never --config electron-builder.config.js
      - uses: actions/upload-artifact@v7
        with:
          name: dist-win
          path: apps/desktop/release/
          retention-days: 7

  publish:
    name: Publish to production
    needs: [version, build-win]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-win
          path: artifacts/
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Upload to S3
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          aws s3 sync artifacts/ "s3://reyogo-desktop/production/win/${TAG}/" \
            --exclude "win-unpacked/*" \
            --exclude "builder-debug.yml"
          YML=$(find artifacts/ -maxdepth 1 -name "*.yml" ! -name "builder-debug.yml" | head -1)
          sed "s|^path: |path: ${TAG}/|; s|- url: |- url: ${TAG}/|g" "$YML" > /tmp/manifest.yml
          aws s3 cp /tmp/manifest.yml "s3://reyogo-desktop/production/win/$(basename "$YML")"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ needs.version.outputs.tag }} \
            --repo ${{ github.repository }} \
            --generate-notes \
            --title "${{ needs.version.outputs.tag }}"
